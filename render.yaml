services:
  - type: web
    name: neuroclass-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_NAME
        value: buffalo_s
      - key: ONNX_PROVIDER
        value: CPUExecutionProvider
      - key: MEMORY_OPTIMIZATION
        value: "true"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: ORT_NUM_THREADS
        value: "1"
    # Render Free tier provides 512MB RAM. buffalo_s is used by default to fit in memory.
    # buffalo_l remains available for local/GPU deployments only.
    plan: free
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
